<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Details</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-sm-6">
            <h2>{{person.name}}</h2>
            <p>{{person.email}}</p>
            <p>{{person.phone}}</p>
            <p>{{person.weight}}</p>
            <p>{{person.height}}</p>
            <p>{{person.gender}}</p>
            <p>{{person.dob}}</p>
        </div>
    </div>
</div>

</body>
</html>
