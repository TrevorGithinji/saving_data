<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Saving Data</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-sm-4">
            <h2> Register here</h2>
            <form action="/submit" method="POST">
                {# post and get, both are used to send data but post is more secure as the data is encrypted            #}
                {% csrf_token %}

                <div class="mb-3 mt-3">
                    <label for="names" class="form-label">Names</label>
                    <input type="text" required class="form-control" id="names" placeholder="Enter names" name="names">
                </div>
                <div class="mb-3 mt-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" required class="form-control" id="email" placeholder="Enter email" name="email">
                </div>
                <div class="mb-3 mt-3">
                    <label for="phone" class="form-label">Email:</label>
                    <input type="tel" required class="form-control" id="email" placeholder="Enter number" name="phone">
                </div>
                <div class="mb-3 mt-3">
                    <label for="weight" class="form-label">weight:</label>
                    <input type="number" required class="form-control" id="weight" placeholder="Enter weight" name="weight">
                </div>
                <div class="mb-3 mt-3">
                    <label for="height" class="form-label">height:</label>
                    <input type="number" required class="form-control" id="height" placeholder="Enter height" name="height">
                </div>
                <div class="mb-3 mt-3">
                    <p>Select gender:</p>
                    <input type="radio" id="gender" name="gender" value="male">
                    <label for="gender" class="form-label">male</label><br>
                    <input type="radio" id="gender" name="gender" value="female">
                     <label for="gender" class="form-label">female</label><br>
                </div>

                <div class="mb-3 mt-3">
                    <label for="dob" class="form-label">Date of birth</label>
                    <input type="date" required class="form-control" id="email" placeholder="Enter dob" name="dob">
                </div>
                <button class="btn btn-danger w-100 mt-3">Submit</button>
            </form>

        </div>
    </div>


</body>
</html>
